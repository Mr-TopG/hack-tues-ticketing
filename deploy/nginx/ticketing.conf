map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Cloudflare terminates visitor TLS and forwards the original scheme in
# X-Forwarded-Proto. Production binds this proxy to host loopback, so only the
# local cloudflared connector can supply this header.
map $http_x_forwarded_proto $origin_forwarded_proto {
    default $scheme;
    https https;
}

map $uri $safe_request_uri {
    default $uri;
    ~^/tickets/check-in/v1/ /tickets/check-in/v1/[redacted]/;
}

log_format ticketing
    '$remote_addr - [$time_local] '
    '"$request_method $safe_request_uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" request_id=$request_id';

upstream ticketing_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log ticketing;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 2m;

    location = /health/ {
        access_log off;
        proxy_pass http://ticketing_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        gzip_static on;
    }

    location / {
        proxy_pass http://ticketing_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
