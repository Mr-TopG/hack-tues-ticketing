{% extends "base.html" %}

{% block title %}Log in | Hack TUES Tickets{% endblock %}

{% block content %}
<section class="card">
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if redirect_field_value %}
            <input
                type="hidden"
                name="{{ redirect_field_name }}"
                value="{{ redirect_field_value }}"
            >
        {% endif %}

        <button type="submit">Log in</button>
    </form>

    <p class="muted">
        No account yet?

        <a href="{% url 'account_signup' %}">
            Register
        </a>
    </p>

    <p>
        <a href="{% url 'account_reset_password' %}">
            Forgot your password?
        </a>
    </p>
</section>
{% endblock %}
