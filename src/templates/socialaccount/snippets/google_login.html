{% load socialaccount %}

{% get_providers as socialaccount_providers %}

{% for provider in socialaccount_providers %}
    {% if provider.id == "google" %}
        <div class="auth-divider" aria-hidden="true">
            <span>or</span>
        </div>

        <form
            method="post"
            action="{% provider_login_url provider.id %}"
            class="social-login"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="button-google"
            >
                <svg
                    class="google-mark"
                    viewBox="0 0 18 18"
                    aria-hidden="true"
                >
                    <path
                        fill="#4285f4"
                        d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.614Z"
                    />
                    <path
                        fill="#34a853"
                        d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.836.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A8.998 8.998 0 0 0 9 18Z"
                    />
                    <path
                        fill="#fbbc05"
                        d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A8.996 8.996 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"
                    />
                    <path
                        fill="#ea4335"
                        d="M9 3.58c1.322 0 2.508.454 3.442 1.345l2.582-2.582C13.463.891 11.426 0 9 0A8.998 8.998 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"
                    />
                </svg>

                Continue with Google
            </button>
        </form>
    {% endif %}
{% endfor %}
