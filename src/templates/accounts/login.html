{% extends "base.html" %}

{% block title %}Log in | Hack TUES Tickets{% endblock %}

{% block content %}
<section class="card">
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        {% if next %}
            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >
        {% endif %}

        <button type="submit">
            Log in
        </button>
    </form>

    <p class="muted">
        No account yet?
        <a href="{% url 'accounts:register' %}">
            Register
        </a>
    </p>
</section>
{% endblock %}
